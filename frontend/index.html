<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biryani Chapathi Snacks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">🍛 Biryani Chapathi Snacks</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#menu">Menu</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="cart-icon" onclick="toggleCart()">
      🛒 <span id="cart-count">0</span>
    </div>
  </header>

  <!-- Hero -->
  <section id="home" class="hero">
    <h1>சுவையான உணவுகள் உங்கள் வீட்டிற்கே!</h1>
    <p>Hot & Fresh Biryani, Chapathi, Snacks - Order Now!</p>
    <button onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">Order Now</button>
  </section>

  <!-- Menu -->
  <section id="menu" class="menu-section">
    <h2>Our Menu</h2>
    <div class="filters">
      <button class="active" onclick="loadProducts('all', this)">All</button>
      <button onclick="loadProducts('biryani', this)">Biryani</button>
      <button onclick="loadProducts('chapathi', this)">Chapathi</button>
      <button onclick="loadProducts('snacks', this)">Snacks</button>
    </div>
    <div id="products" class="products"></div>
  </section>

  <!-- Cart Sidebar -->
  <div id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <span onclick="toggleCart()" style="cursor:pointer">✖</span>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <h4>Total: ₹<span id="cartTotal">0</span></h4>
      <button onclick="openCheckout()">Checkout</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="modal">
    <div class="modal-content">
      <h3>Delivery Details</h3>
      <input type="text" id="custName" placeholder="Your Name">
      <input type="tel" id="custPhone" placeholder="Phone Number">
      <textarea id="custAddress" placeholder="Delivery Address"></textarea>
      <div class="modal-buttons">
        <button onclick="placeOrder()">Place Order</button>
        <button class="cancel" onclick="closeCheckout()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer id="contact">
    <p>📍 Chennai | 📞 +91 98765 43210</p>
    <p>© 2025 Biryani Chapathi Snacks</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
